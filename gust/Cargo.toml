[workspace]
members = [".", "codegen"]

[package]
name = "gust"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Test-run a single task from an Airflow executable Dag bundle"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
regress = "0.10"
rmp = "0.8"
rmp-serde = "1.3"
rmpv = { version = "1.3", features = ["with-serde"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
serde_yaml = "0.9"
sha2 = "0.10"
shlex = "1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
