[build-system]
requires = ["flit_core >=4.2.0"]
build-backend = "flit_core.buildapi"

[project]
name = "apache-airflow-contributor-tools"
version = "0.0.1"
description = "Run Airflow source tests and a source instance on local Postgres or MySQL, without Docker"
readme = "README.md"
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[project.scripts]
airflow-dev = "airflow_dev.cli:main"

[dependency-groups]
dev = ["pytest>=9.0.0"]

[tool.flit.module]
name = "airflow_dev"

# Its own workspace, so the root workspace never resolves or locks this tool.
[tool.uv.workspace]
members = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "D"]
